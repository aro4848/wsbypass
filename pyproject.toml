[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsbypass"
version = "0.1.0"
description = "Universal Cloudflare-bypassing WebSocket client using TLS impersonation"
readme = "README.md"
authors = [{ name = "aro22" }]
dependencies = [
    "curl_cffi>=0.7.0"
]
requires-python = ">=3.8"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]

[tool.setuptools.packages.find]
include = ["wsbypass*"]
